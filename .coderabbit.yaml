# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  # The high-level summary is written by editing the pull request description
  # itself. The description is authored deliberately, so CodeRabbit does not get
  # to append to it. Note that the `@coderabbitai summary` placeholder re-enables
  # the summary for a single pull request even while this is false; keep that
  # string out of descriptions.
  high_level_summary: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    # Each review run, including an automatic incremental one, consumes from a
    # per-developer hourly allowance shared across every repository. Reviewing
    # each work-in-progress push exhausts it well before a branch is ready, so
    # only the maintainer decides when a branch gets another review run. Agents
    # must never post `@coderabbitai review` to re-trigger one.
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 2

  path_filters:
    - "!bun.lock"
    # Generated metadata is noisy; the authored schema and SQL migrations remain reviewable.
    - "!drizzle/meta/**"

  path_instructions:
    - path: "**/*.{ts,tsx,sql,yml,yaml}"
      instructions: |
        Report concrete correctness, security, data-integrity, accessibility, or
        maintainability problems. Do not report formatting or style issues already
        enforced by Biome.

        Keep one independently fixable problem per comment. For every finding:
        - State the severity and a realistic failure scenario.
        - Cite evidence in the changed code.
        - Give a minimal implementation direction without prescribing a broad refactor.
        - Name the regression test or command that should prove the fix.
        Do not speculate when the repository code disproves a concern.

    - path: "{lib/checkout/**,lib/orders/**,lib/webhooks/**,lib/email/**,app/api/checkout/**,app/api/webhooks/**}"
      instructions: |
        Treat commerce changes as failure-sensitive distributed workflows:
        - Browser cart data, prices, totals, inventory, identity, URLs, and statuses
          are untrusted. Resolve purchasable variants, prices, currency, and
          availability on the server before creating Stripe Checkout.
        - Stripe is authoritative for payment, tax, refund, dispute, and payment state.
          Persisted totals and immutable item snapshots must reconcile with Stripe.
        - Verify the unchanged raw webhook body and Stripe signature before parsing
          trusted event data or causing side effects.
        - Webhook transitions must remain safe under duplicate, delayed, retried, and
          out-of-order events through durable idempotency and explicit state changes.
        - Never discard a verified paid event because inventory is unavailable. Preserve
          a traceable exception state or deterministic compensating path.
        - Paid-order persistence, immutable snapshots, inventory allocation, and the
          confirmation-delivery record must remain atomic.
        - Refunds and disputes must affect fulfillment eligibility correctly.
        - Email delivery happens after the order commit, is retryable and idempotent,
          and must never roll back a paid order.
        Check whether the change affects any invariant or failure mode listed
        above. Ask for focused regression coverage for each affected behavior.
        Do not demand unrelated tests.

    - path: "{lib/auth/**,lib/actions/**,lib/admin/**,app/admin/**,app/api/admin/**,middleware.ts}"
      instructions: |
        Treat authentication and authorization separately. Require server-side admin
        authorization for every protected read and write, including helpers called
        outside route components. Treat client checks and browser values as untrusted,
        validate every mutation payload, and avoid leaking whether protected resources
        exist.

    - path: "{lib/db/**,lib/validators/**,drizzle/**}"
      instructions: |
        Keep Drizzle schema, SQL migrations, queries, and Zod contracts aligned. Review
        nullability, defaults, constraints, uniqueness, indexes, foreign-key behavior,
        rollback compatibility, and required backfills. Financial values remain safe
        nonnegative integer cents. Concurrency-sensitive writes require transactions,
        unique constraints, locks, or conditional updates rather than read-then-write
        timing assumptions.

    - path: "{lib/observability/**,sentry.*.config.ts,instrumentation*.ts}"
      instructions: |
        Do not allow customer data, addresses, request bodies, raw webhook payloads,
        payment details, credentials, or secrets into logs, errors, monitoring tags, or
        test snapshots. Keep telemetry optional and safe when configuration is absent.

    - path: "{app/**,components/**}"
      instructions: |
        Check semantic HTML, accessible names, keyboard operation, focus behavior,
        pending and error states, and server/client trust boundaries. Prefer existing
        shared UI primitives and simple component composition.

    - path: "{app/(shop)/**,app/admin/**,app/api/**,components/cart/**,components/shop/**,components/admin/**,lib/checkout/**,lib/orders/**,lib/webhooks/**,lib/email/**}"
      instructions: |
        These paths implement the user flows the Playwright e2e suite covers (e2e/, with
        docs/manual-qa.md as its source spec). When a change adds a new user-facing flow or
        alters an existing one, require matching e2e coverage and its corresponding section in
        docs/manual-qa.md. For a genuinely non-automatable flow, require a matching manual-only
        entry instead. Compare the changed flow with its coverage rather than accepting unrelated
        edits: an admin-flow change still lacks coverage if the pull request includes only an
        unrelated e2e edit, or its matching e2e spec without the manual-QA section. Do not demand
        e2e coverage for changes that are invisible to users, such as refactors, styling-only
        edits, or observability changes.

    - path: "tests/**"
      instructions: |
        Require focused coverage for changed behavior, especially error paths,
        authorization failures, idempotency, boundary values, replay behavior, and
        concurrency-sensitive commerce operations. Prefer tests that prove externally
        observable or persisted outcomes over implementation details.

chat:
  auto_reply: true
