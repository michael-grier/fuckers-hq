name: PR Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action != 'edited' || github.event.changes.base != null)
      )
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservation_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI only needs repository reads, so do not leave its token in the Git config.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high-severity dependencies
        run: bun audit --audit-level=high

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
        env:
          RESERVATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/reservation_test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # ClerkProvider requires a syntactically valid public key while prerendering. This
          # documentation-only key keeps forked PR builds independent of repository secrets.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5hY2NvdW50cy5kZXYk
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action != 'edited' || github.event.changes.base != null)
      )
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fuckers_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fuckers_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Pushes, manual runs, and same-repository PRs may use repository secrets. Fork PRs never
      # receive them, so they report an explicit skip instead of failing for missing credentials.
      E2E_SECRETS_REQUIRED: >-
        ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
      E2E_SECRETS_PRESENT: >-
        ${{ secrets.STRIPE_SECRET_KEY != '' &&
            secrets.CLERK_SECRET_KEY != '' &&
            secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' &&
            secrets.E2E_CLERK_USER_EMAIL != '' &&
            secrets.ADMIN_USER_IDS != '' }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuckers_e2e
      # Seeding requires the explicit disposable-database opt-in (e2e/setup/global-setup.ts).
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuckers_e2e
      # Deterministic admin specs intercept image uploads. Fake configuration exposes the upload
      # controls without granting CI access to R2 or requiring another external service.
      R2_ACCOUNT_ID: e2e-account
      R2_ACCESS_KEY_ID: e2e-access-key
      R2_SECRET_ACCESS_KEY: e2e-secret-access-key
      R2_BUCKET: e2e-bucket
      R2_PUBLIC_URL: https://e2e-r2.invalid
      # Exercise local delivery instead of silently skipping its deterministic commerce test.
      DELIVERY_ENABLED: "true"
      DELIVERY_AREA_NAME: E2E delivery area
      DELIVERY_INSTRUCTIONS: Test orders only.
      # Deterministic CI records retryable email state and local errors without contacting Resend
      # or the production Sentry project.
      RESEND_API_KEY: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""

    steps:
      - name: Require e2e secrets for trusted runs
        if: env.E2E_SECRETS_REQUIRED == 'true' && env.E2E_SECRETS_PRESENT != 'true'
        run: |
          echo "::error::The five required E2E repository secrets are not configured."
          exit 1

      - name: Report unavailable e2e secrets for a fork
        if: env.E2E_SECRETS_REQUIRED != 'true' && env.E2E_SECRETS_PRESENT != 'true'
        run: echo "Fork pull requests do not receive repository secrets; skipping E2E."

      - name: Check out the pull request
        if: env.E2E_SECRETS_PRESENT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        if: env.E2E_SECRETS_PRESENT == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun x playwright install --with-deps chromium

      - name: Migrate the e2e database
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun run db:migrate

      - name: Build
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Run the e2e suite
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun run test:e2e
        env:
          # Serve the production bundle built above instead of racing dev-server compiles.
          E2E_WEB_SERVER_COMMAND: bun run start
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # The deterministic tiers sign and verify with the same local value, so any
          # non-empty string works; a real listener secret is only needed by the live tier.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_e2e_ci_only' }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload safe diagnostics on failure
        if: failure() && env.E2E_SECRETS_PRESENT == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Authenticated traces can retain session-bearing network data. Keep them off GitHub;
          # screenshots, accessibility snapshots, and the JSON report contain enough first-pass
          # context without preserving request headers.
          name: e2e-failure-diagnostics
          path: |
            .e2e-artifacts/**/*.png
            .e2e-artifacts/**/error-context.md
            .e2e-artifacts/results.json
          include-hidden-files: true
          retention-days: 7
