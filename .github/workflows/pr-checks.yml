name: PR Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action != 'edited' || github.event.changes.base != null)
      )
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservation_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # CI only needs repository reads, so do not leave its token in the Git config.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high-severity dependencies
        run: bun audit --audit-level=high

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
        env:
          RESERVATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/reservation_test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # ClerkProvider requires a syntactically valid public key while prerendering. This
          # documentation-only key keeps forked PR builds independent of repository secrets.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5hY2NvdW50cy5kZXYk
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action != 'edited' || github.event.changes.base != null)
      )
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fuckers_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fuckers_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The whole job no-ops (each step skips, job stays green) until the e2e secrets exist.
      # Forked PRs never see secrets, so this also keeps the job quiet for external PRs.
      E2E_SECRETS_PRESENT: >-
        ${{ secrets.STRIPE_SECRET_KEY != '' &&
            secrets.CLERK_SECRET_KEY != '' &&
            secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' &&
            secrets.E2E_CLERK_USER_EMAIL != '' &&
            secrets.ADMIN_USER_IDS != '' }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuckers_e2e
      # Seeding requires the explicit disposable-database opt-in (e2e/setup/global-setup.ts).
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuckers_e2e

    steps:
      - name: Report when e2e secrets are not configured
        if: env.E2E_SECRETS_PRESENT != 'true'
        run: echo "e2e secrets are not configured; skipping the browser suite."

      - name: Check out the pull request
        if: env.E2E_SECRETS_PRESENT == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Bun
        if: env.E2E_SECRETS_PRESENT == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun x playwright install --with-deps chromium

      - name: Migrate the e2e database
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun run db:migrate

      - name: Build
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Run the e2e suite
        if: env.E2E_SECRETS_PRESENT == 'true'
        run: bun run test:e2e
        env:
          # Serve the production bundle built above instead of racing dev-server compiles.
          E2E_WEB_SERVER_COMMAND: bun run start
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # The deterministic tiers sign and verify with the same local value, so any
          # non-empty string works; a real listener secret is only needed by the live tier.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_e2e_ci_only' }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload traces on failure
        if: failure() && env.E2E_SECRETS_PRESENT == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: .e2e-artifacts/
          retention-days: 7
