name: Ship main

on:
  push:
    branches:
      - main
  # Manual runs can replay a guarded migration or rebuild stale Vercel output without its cache.
  # The ref guard on the migrate job limits dispatches to main.
  workflow_dispatch:
    inputs:
      force_no_build_cache:
        description: Build without Vercel's existing cache
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Queue production deploys instead of cancelling in-flight ones. A migration that is already
# running must finish, and two merges landing close together must apply in commit order; GitHub
# keeps only the newest queued run, whose commit already contains the earlier merge's migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    # A manual dispatch can select any branch, which would run that branch's code against
    # production with the deploy secrets. Only main may migrate; skipping this job also skips
    # the dependent deploy job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The migration URL is intentionally direct while Vercel uses a pooled URL. Both hostnames
      # carry the same non-secret endpoint ID, which catches a dev/production branch mix-up.
      - name: Verify production database target
        run: bun run db:verify-production-target --required
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_NEON_ENDPOINT_ID: ${{ vars.PRODUCTION_NEON_ENDPOINT_ID }}

      # A failing or aborting migration — including a guarded backfill that refuses to guess and
      # names the offending rows — fails this job, which blocks the deploy job below. Fix forward
      # per docs/migrations/README.md, then re-run the workflow; the migrator is idempotent.
      - name: Apply pending migrations to production
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  # The shared dev branch database is the fallback for the main checkout and for worktrees
  # without Neon credentials, but nothing migrated it on merge: worktree branches migrate via
  # setup:worktree and production migrates above, so dev silently drifted behind every
  # schema-changing merge. Independent of the deploy chain on purpose — a dev-database failure
  # must not block a production deploy. Requires the DEV_DATABASE_URL repository secret.
  migrate-dev:
    name: Migrate dev database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply pending migrations to dev
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

  deploy:
    name: Deploy to Vercel
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # The build runs on Vercel with the project's own environment variables, so the runner
      # holds no application secrets — only the deploy token. vercel.json disables Vercel's
      # git-driven deploys of main so this is the only production deploy path.
      - name: Deploy production
        run: |
          deploy_args=(deploy --prod --yes --token "$VERCEL_TOKEN")
          if [[ "$FORCE_NO_BUILD_CACHE" == "true" ]]; then
            deploy_args+=(--force)
          fi
          bun x vercel@58 "${deploy_args[@]}"
        env:
          FORCE_NO_BUILD_CACHE: ${{ inputs.force_no_build_cache }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
