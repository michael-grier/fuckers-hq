version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    groups:
      # @sentry/nextjs requires the exact same @sentry/bun version (which `bun test` loads), so
      # the two must move together.
      sentry:
        patterns:
          - "@sentry/*"
      # getSignedUrl from the presigner only accepts an S3Client from the same SDK release, so a
      # version split between the two fails typecheck in lib/r2.ts.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Edmonton
    open-pull-requests-limit: 5
